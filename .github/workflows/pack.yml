name: Pack Fcitx5 Offline

on:
  workflow_dispatch:

jobs:
  pack:
    name: Build Fcitx5 offline package
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare
        run: |
          set -e
          test "$(dpkg --print-architecture)" = "amd64"
          sudo apt update
          sudo apt install -y zip
          mkdir -p fcitx5-rime/deb

      - name: Download Fcitx5 Pinyin for elementary OS 8.1
        run: |
          set -e
          TARGET_PKGS="fcitx5 fcitx5-pinyin fcitx5-frontend-gtk4"

          DEPS=$(apt-cache depends --recurse \
                  --no-recommends \
                  --no-suggests \
                  --no-conflicts \
                  --no-breaks \
                  --no-replaces \
                  --no-enhances \
                  $TARGET_PKGS \
                  | grep "Depends:" \
                  | awk '{print $2}' \
                  | grep -vE '^(<.*>|hunspell|aspell|myspell|i[a-z]+-|.*qt.*|.*rime.*)' \
                  | sort -u)

          ALL_PKGS="$TARGET_PKGS $DEPS"
          sudo apt-get download $ALL_PKGS
          mv *.deb fcitx5-rime/deb/

      - name: Generate files
        run: |
          set -e
          cat > fcitx5-rime/install.sh <<'EOF'
          #!/bin/bash
          sudo dpkg -i "$(dirname "$0")"/deb/*.deb || sudo apt-get install -f -y
          EOF
          chmod +x fcitx5-rime/install.sh

          {
            echo "Package: Fcitx5"
            echo
            find fcitx5-rime/deb -type f -name "*.deb" -printf "%f\n"
          } > fcitx5-rime/manifest.txt

      - name: Pack
        run: zip -r fcitx5-rime.zip fcitx5-rime

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5
          path: fcitx5-rime.zip
          retention-days: 15
